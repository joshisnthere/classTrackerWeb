<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Schedule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="topbar">
    <span class="topbar__label">Class Schedule</span>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" class="theme-toggle__option" data-theme-option="light">Light</button>
      <button type="button" class="theme-toggle__option" data-theme-option="dark">Dark</button>
    </div>
  </header>

  <section class="now-panel">
    <p class="now-panel__meta" id="clockLine">&nbsp;</p>
    <p class="now-panel__state" id="stateLine" aria-live="polite">&nbsp;</p>
    <p class="now-panel__countdown" id="countdownLine">&nbsp;</p>
    <p class="now-panel__sub" id="subLine">&nbsp;</p>
  </section>

  <div class="content-grid">

    <section class="today-schedule">
      <h2 class="section-title">Today</h2>
      <ol class="period-list" id="todayList">
        <!-- populated by script.js -->
      </ol>
      <p class="empty-note" id="todayEmptyNote" hidden>No classes added for today yet. Add some in the editor.</p>
    </section>

    <section class="editor">
      <h2 class="section-title">Edit schedule</h2>

      <div class="day-tabs" id="dayTabs" role="tablist" aria-label="Day of week">
        <button type="button" class="day-tabs__tab" data-day="mon" role="tab">Mon</button>
        <button type="button" class="day-tabs__tab" data-day="tue" role="tab">Tue</button>
        <button type="button" class="day-tabs__tab" data-day="wed" role="tab">Wed</button>
        <button type="button" class="day-tabs__tab" data-day="thu" role="tab">Thu</button>
        <button type="button" class="day-tabs__tab" data-day="fri" role="tab">Fri</button>
      </div>

      <div class="period-rows" id="periodRows">
        <!-- populated by script.js -->
      </div>

      <button type="button" class="add-row-btn" id="addRowBtn">Add a period</button>
      <p class="row-error" id="rowError" hidden></p>
    </section>

  </div>

  <section class="settings">
    <button type="button" class="text-btn" id="clearDataBtn">Clear all schedule data</button>
    <p class="settings__note">Everything is saved on this device only, in your browser's local storage.</p>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
